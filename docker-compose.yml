networks:
  edge:
    driver: bridge
  core:
    internal: true
  # B4: sandbox-runner reaches the Docker API only through
  # docker-socket-proxy on this network — no direct socket bind mount
  # (invariant #8).
  sock:
    internal: true

volumes:
  pgdata:

x-offline-env: &offline-env
  DO_NOT_TRACK: "1"
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"

services:
  web:
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    networks:
      - edge
    ports:
      - "8080:80"
    depends_on:
      - api

  api:
    restart: unless-stopped
    image: opex-api:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    networks:
      - edge
      - core
    environment:
      <<: *offline-env
      # Not "production": no TLS terminates in front of the API until B6,
      # and express-session correctly refuses to ever send a `secure` cookie
      # over plain HTTP — setting this to "production" here would silently
      # break every login. Flip this once B6 adds TLS at the edge.
      NODE_ENV: development
      PORT: "3000"
      DATABASE_URL: postgres://${POSTGRES_USER:-opex}:${POSTGRES_PASSWORD:-opex_dev_only_change_me}@postgres:5432/${POSTGRES_DB:-opex}
      SESSION_SECRET: ${SESSION_SECRET:-dev_only_change_me_use_a_random_64_byte_value}
      MODELS_DIR: /models
      MANIFEST_PATH: /app/infra/models/manifest.yaml
      # Model URLs. Empty = the bundled container from infra/models/manifest.yaml. To use a
      # model served elsewhere on the private network, set the URL in .env and restart the API.
      LLM_MAIN_URL: ${LLM_MAIN_URL:-}
      LLM_ROUTER_URL: ${LLM_ROUTER_URL:-}
      LLM_VISION_URL: ${LLM_VISION_URL:-}
      LLM_EMBED_URL: ${LLM_EMBED_URL:-}
      LLM_RERANK_URL: ${LLM_RERANK_URL:-}
      DATA_DIR: /data
      SANDBOX_RUNNER_URL: http://sandbox-runner:8000
      SANDBOX_SHARED_SECRET: ${SANDBOX_SHARED_SECRET:-dev_only_change_me}
    volumes:
      - ./models:/models:ro
      - ./data:/data
      # Feedback triage's "export to eval" writes a new case into
      # eval/questions/answers.json — that dir isn't baked into the api
      # image (only dist/ is), so it needs a real host mount, same
      # reasoning as ./data above.
      - ./eval/questions:/app/eval/questions
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"

  postgres:
    image: pgvector/pgvector:pg16
    networks:
      - core
    environment:
      <<: *offline-env
      POSTGRES_USER: ${POSTGRES_USER:-opex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opex_dev_only_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-opex}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No published port: `core` is internal:true, and Docker doesn't forward
    # host ports onto internal-only networks anyway. Reach postgres for
    # migrations/psql/spikes via `docker compose exec postgres ...` — never
    # by exposing it to the host (see invariant #1).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opex}"]
      interval: 5s
      timeout: 5s
      retries: 10

  llm-small:
    # Superseded by the single llm-main model (roles are URLs in .env). Start with: docker compose --profile legacy up -d llm-small
    profiles: ["legacy"]
    restart: unless-stopped
    image: ghcr.io/ggml-org/llama.cpp:server
    networks:
      - core
    environment: *offline-env
    volumes:
      - ./models:/models:ro
    mem_limit: 1g
    command: ["-m", "/models/qwen2.5-0.5b-instruct-q4_k_m.gguf", "--host", "0.0.0.0", "--port", "8081", "-c", "8192", "--jinja"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  llm-main:
    restart: unless-stopped
    image: ghcr.io/ggml-org/llama.cpp:server
    networks:
      - core
    environment: *offline-env
    volumes:
      - ./models:/models:ro
    # One Qwen2.5-VL-7B serves chat, vision and routing. -np 2 lets a routing call and a
    # chat call run at the same time (each slot gets half of -c). Sized for a ~10 GB Docker VM.
    mem_limit: 8g
    command: ["-m", "/models/Qwen2.5-VL-7B-Instruct-Q4_K_M.gguf", "--mmproj", "/models/mmproj-Qwen2.5-VL-7B-Instruct-Q8_0.gguf", "--host", "0.0.0.0", "--port", "8082", "-c", "16384", "-np", "2", "--jinja"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8082/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 60s

  llm-vision:
    # Superseded by the single llm-main model (roles are URLs in .env). Start with: docker compose --profile legacy up -d llm-vision
    profiles: ["legacy"]
    restart: unless-stopped
    image: ghcr.io/ggml-org/llama.cpp:server
    networks:
      - core
    environment: *offline-env
    volumes:
      - ./models:/models:ro
    # A hard cap so a vision request that balloons is killed on its own
    # instead of taking llm-main down with it (the VM shares one memory pool).
    mem_limit: 3500m
    command: ["-m", "/models/Qwen2.5-VL-3B-Instruct-Q4_K_M.gguf", "--mmproj", "/models/mmproj-Qwen2.5-VL-3B-Instruct-Q8_0.gguf", "--host", "0.0.0.0", "--port", "8085", "-c", "4096", "-np", "1", "--jinja"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8085/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 60s

  llm-embed:
    restart: unless-stopped
    image: ghcr.io/ggml-org/llama.cpp:server
    networks:
      - core
    environment: *offline-env
    volumes:
      - ./models:/models:ro
    mem_limit: 1g
    command: ["-m", "/models/bge-m3-Q8_0.gguf", "--host", "0.0.0.0", "--port", "8083", "--embedding", "-c", "8192"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  llm-rerank:
    # Superseded by the single llm-main model (roles are URLs in .env). Start with: docker compose --profile legacy up -d llm-rerank
    profiles: ["legacy"]
    restart: unless-stopped
    image: ghcr.io/ggml-org/llama.cpp:server
    networks:
      - core
    environment: *offline-env
    volumes:
      - ./models:/models:ro
    mem_limit: 1g
    command: ["-m", "/models/bge-reranker-v2-m3-Q8_0.gguf", "--host", "0.0.0.0", "--port", "8084", "--reranking", "-c", "8192"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8084/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  ingest:
    image: opex-ingest:local
    build:
      context: .
      dockerfile: services/ingest/Dockerfile
    networks:
      - core
    environment:
      <<: *offline-env
      DATABASE_URL: postgres://${POSTGRES_USER:-opex}:${POSTGRES_PASSWORD:-opex_dev_only_change_me}@postgres:5432/${POSTGRES_DB:-opex}
      LLM_EMBED_URL: ${LLM_EMBED_URL:-http://llm-embed:8083}
      LLM_MAIN_URL: ${LLM_MAIN_URL:-http://llm-main:8082}
      DATA_DIR: /data
      # Docling downloads its layout/table-structure models from HF on
      # first use — HF_HUB_OFFLINE=1 correctly blocks that at runtime, so
      # the cache must be pre-populated on the host (./scripts/fetch-models.sh)
      # and mounted in, exactly like the GGUF models/ mount below it.
      HF_HOME: /hf-cache
    volumes:
      - ./data:/data
      - ./models/docling-cache:/hf-cache:ro
    depends_on:
      postgres:
        condition: service_healthy

  # B4: the only Docker-socket touchpoint in the system (invariant #8) —
  # a read-only bind mount of the real socket, allowlisted to only the
  # Docker API calls docker_exec.py actually makes (container create/
  # start/wait/logs/kill/remove). Images/networks/volumes/exec/swarm all
  # denied by omission — the proxy is deny-by-default.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    networks:
      - sock
    environment:
      CONTAINERS: "1"
      POST: "1"
      IMAGES: "0"
      NETWORKS: "0"
      VOLUMES: "0"
      EXEC: "0"
      SWARM: "0"
      SYSTEM: "0"
      INFO: "1" # enabled ahead of the next milestone's runtime=runsc detection (client.info())
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  sandbox-runner:
    build:
      context: .
      dockerfile: services/sandbox-runner/Dockerfile
    networks:
      - core
      - sock
    environment:
      <<: *offline-env
      SANDBOX_SHARED_SECRET: ${SANDBOX_SHARED_SECRET:-dev_only_change_me}
      # docker-py's docker.from_env() reads this automatically — no code
      # change needed to point it at the proxy instead of a local socket.
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      PERSIST_BASE_DIR: /data/projects
      # Docker-outside-of-Docker: sandbox-runner's persist=true bind-mounts
      # this directory into a *sibling* container it asks the real daemon
      # to create — that daemon resolves the mount source against the
      # host's filesystem, not sandbox-runner's own container-internal
      # /data view, even though both cover the same subtree. ${PWD} is the
      # shell's cwd when `docker compose` is invoked — this repo's own
      # convention (./data, ./models, etc.) already assumes that's the
      # repo root, same assumption as everywhere else in this file.
      PERSIST_HOST_BASE_DIR: ${PWD}/data/projects
    volumes:
      # Shares the same host ./data api/ingest already mount — persist=true
      # writes land under /data/projects/<projectId>, visible to both.
      - ./data:/data
    depends_on:
      - docker-socket-proxy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---- One-time setup steps (compose profile "setup"; never started by a normal `up`) ----
  # These are the only services with internet access (the `edge` network), used once to
  # download model files and Docling's caches. Every runtime service stays on the internal
  # `core` network (invariant 1).
  model-fetch:
    profiles: ["setup"]
    image: opex-api:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    networks:
      - edge
    environment:
      MODELS_DIR: /models
      MANIFEST_PATH: /app/infra/models/manifest.yaml
      DO_NOT_TRACK: "1"
    volumes:
      - ./models:/models
    command: ["node", "dist/scripts/fetchModels.js"]

  docling-warm:
    profiles: ["setup"]
    image: opex-ingest:local
    build:
      context: .
      dockerfile: services/ingest/Dockerfile
    networks:
      - edge
    environment:
      HF_HOME: /hf-cache
      HF_HUB_OFFLINE: "0"
      TRANSFORMERS_OFFLINE: "0"
      DO_NOT_TRACK: "1"
    volumes:
      - ./models/docling-cache:/hf-cache
    command:
      - python
      - -c
      - "from docling.document_converter import DocumentConverter; DocumentConverter(); print('[docling] model cache warmed')"

  sandbox-image:
    profiles: ["setup"]
    image: opex/sandbox-python:latest
    build:
      context: .
      dockerfile: services/sandbox-runner/Dockerfile.sandbox-image
    command: ["true"]
