[project]
name = "opex-ingest"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
# docling and pytest/httpx are declared here for A2 (real ingestion) and for
# Spike C's standalone throughput check; not imported by the A1 service itself.
dev = ["pytest>=8", "httpx>=0.27", "docling>=2.0"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
# Belt-and-suspenders alongside the editable install: uv's virtualenv .pth
# hook ordering doesn't reliably put src/ on sys.path for `import ingest`.
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingest"]
