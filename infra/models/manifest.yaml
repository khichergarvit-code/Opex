# Model registry, loaded into the `models` table at API boot. Every enabled local
# entry's file is verified against its pinned SHA-256 (invariant 3) — see
# scripts/manifest-check.ts.
#
# One vision-language model serves chat, vision and routing (llm-main, llm-router and
# llm-vision are three roles on the same file/URL), plus bge-m3 for embeddings.
# It comes in two TIERS, selected with LLM_TIER in .env (default `small`):
#   small     Qwen3-VL-4B   Apache-2.0, ~3 GB, fastest; fits a 4 GB GPU and any Mac
#   standard  Qwen2.5-VL-7B Apache-2.0, ~5.5 GB, higher quality; needs an 8 GB+ GPU / 16 GB Mac
# Benchmarked on an Apple M4 (scripts/bench_models.py): 4B = 33 tok/s, routing 0.5 s;
# 7B = 21 tok/s, routing 1.1 s; both 6/7 on the mini suite (maths word-problems are
# answered exactly through the code tool, not by mental arithmetic).
#
# Every endpoint reads `${LLM_<ROLE>_URL:-default}` from the environment: pointing a role at
# another server (or a natively running llama-server) is a .env change only — internal hosts
# only, shown as "unverified". LLM_CTX_LEN overrides the context size the API assumes.
#
# `source_url` / `mmproj_source_url` are used only by the setup step (model-fetch).
x-templates:
  small: &small
    tier: small
    gguf_path: Qwen3VL-4B-Instruct-Q4_K_M.gguf
    sha256: "66358cb18bb6b3b1b6675aa412c7a88ef01d228f481184d13668e5201c730a0a"
    mmproj_path: mmproj-Qwen3VL-4B-Instruct-Q8_0.gguf
    mmproj_sha256: "30ba2c7dd3127a4561b6cba9d13d0f711c91bdb38742e2f56d73c8cb596bd06d"
    ctx_len: 8192
    vram_mb: 3200
    license: apache-2.0
    origin: Qwen/Qwen3-VL-4B-Instruct-GGUF
    source_url: https://huggingface.co/Qwen/Qwen3-VL-4B-Instruct-GGUF/resolve/main/Qwen3VL-4B-Instruct-Q4_K_M.gguf
    mmproj_source_url: https://huggingface.co/Qwen/Qwen3-VL-4B-Instruct-GGUF/resolve/main/mmproj-Qwen3VL-4B-Instruct-Q8_0.gguf
  standard: &standard
    tier: standard
    gguf_path: Qwen2.5-VL-7B-Instruct-Q4_K_M.gguf
    sha256: "9258bf05b12686d097ff3b6b18d968ab393649780aa2b3cd67fec43d50554392"
    mmproj_path: mmproj-Qwen2.5-VL-7B-Instruct-Q8_0.gguf
    mmproj_sha256: "2ddb555391bae966e412deab9e07b58afa18bcc06930ba0f1c78a3695ab9e506"
    ctx_len: 16384
    vram_mb: 6000
    license: apache-2.0
    origin: ggml-org/Qwen2.5-VL-7B-Instruct-GGUF
    source_url: https://huggingface.co/ggml-org/Qwen2.5-VL-7B-Instruct-GGUF/resolve/main/Qwen2.5-VL-7B-Instruct-Q4_K_M.gguf
    mmproj_source_url: https://huggingface.co/ggml-org/Qwen2.5-VL-7B-Instruct-GGUF/resolve/main/mmproj-Qwen2.5-VL-7B-Instruct-Q8_0.gguf

models:
  - id: llm-main
    role: general
    endpoint: "${LLM_MAIN_URL:-http://llm-main:8082}"
    <<: *small
    capabilities: [json_schema, tools, vision]
    enabled: true

  - id: llm-router
    role: router
    endpoint: "${LLM_ROUTER_URL:-http://llm-main:8082}"
    <<: *small
    capabilities: [json_schema, tools]
    enabled: true

  - id: llm-vision
    role: vision
    endpoint: "${LLM_VISION_URL:-http://llm-main:8082}"
    <<: *small
    capabilities: [vision]
    enabled: true

  - id: llm-main-standard
    role: general
    endpoint: "${LLM_MAIN_URL:-http://llm-main:8082}"
    <<: *standard
    capabilities: [json_schema, tools, vision]
    enabled: true

  - id: llm-router-standard
    role: router
    endpoint: "${LLM_ROUTER_URL:-http://llm-main:8082}"
    <<: *standard
    capabilities: [json_schema, tools]
    enabled: true

  - id: llm-vision-standard
    role: vision
    endpoint: "${LLM_VISION_URL:-http://llm-main:8082}"
    <<: *standard
    capabilities: [vision]
    enabled: true

  - id: llm-embed
    role: embed
    endpoint: "${LLM_EMBED_URL:-http://llm-embed:8083}"
    gguf_path: bge-m3-Q8_0.gguf
    sha256: "950f4a8e5e19477a6d3c26d2f162233c20002c601f75e4b002e3239997821167"
    ctx_len: 8192
    capabilities: []
    vram_mb: 900
    license: mit
    origin: gpustack/bge-m3-GGUF
    enabled: true
    source_url: https://huggingface.co/gpustack/bge-m3-GGUF/resolve/main/bge-m3-Q8_0.gguf

  # Optional. Off by default; set LLM_RERANK_URL in .env to a reranker server to turn it on.
  # Without it, document search keeps the fused order and judges "no support" by embedding similarity.
  - id: llm-rerank
    role: rerank
    endpoint: "${LLM_RERANK_URL:-http://llm-rerank:8084}"
    gguf_path: bge-reranker-v2-m3-Q8_0.gguf
    sha256: "a43c7c9b11a4c1517e5bf95151960e1621d1b72f7a493364b01e386cf1aaa1d3"
    ctx_len: 8192
    capabilities: []
    vram_mb: 900
    license: apache-2.0
    origin: gpustack/bge-reranker-v2-m3-GGUF
    enabled: false
    enabled_if_env: LLM_RERANK_URL
    source_url: https://huggingface.co/gpustack/bge-reranker-v2-m3-GGUF/resolve/main/bge-reranker-v2-m3-Q8_0.gguf

  # Image generation (optional). Served by a native stable-diffusion.cpp server on the GPU
  # (scripts/run-native-imagegen.*); enabled by setting LLM_IMAGE_URL in .env.
  # DreamShaper 8 LCM: Stable-Diffusion-1.5 class with 4-step LCM baked in (CreativeML OpenRAIL-M, commercial use
  # allowed with the licence's use restrictions), fp16 single file ~2.1 GB, fits a 4 GB GPU.
  - id: llm-image
    role: image
    endpoint: "${LLM_IMAGE_URL:-http://host.docker.internal:8090}"
    external_only: true
    ctx_len: 1
    license: creativeml-openrail-m
    origin: Lykon/dreamshaper-8-lcm
    enabled: false
    enabled_if_env: LLM_IMAGE_URL

# Files fetched by the setup step but not registered as chat models.
downloads:
  - name: image-model
    group: image
    file: DreamShaper8_LCM.safetensors
    url: https://huggingface.co/Lykon/dreamshaper-8-lcm/resolve/main/DreamShaper8_LCM.safetensors
    sha256: "a4f3e1526c5dc4fcbe342f5c410d83ae202c7a415fcefcbb92e0f93fcd0a87c3"
