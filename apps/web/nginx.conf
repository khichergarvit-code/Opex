server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location /auth/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
    }
    location /me {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
    }
    location /projects {
        client_max_body_size 50m;   # matches the policy uploadLimitMb (documents are uploaded here)
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
    }
    location /conversations {
        client_max_body_size 10m;
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
    location /documents {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
    location /artifacts {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
    }
    location /workspace {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
    }
    location /admin {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
    }
    location /access-requests {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
    }
    location /feedback {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
    }
    location /approvals {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
    }
    location /models {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
    }
    location /memory {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
    }

    location / {
        try_files $uri /index.html;
    }
}
